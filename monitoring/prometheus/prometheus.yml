global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "hospital-readmission-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"] # "api" = the Compose service name below, port 8000 per the Dockerfile

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
