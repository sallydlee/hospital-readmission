# Fired alerts land here for grouping/deduplication/routing. Ships with
# no real notification channel wired up (alerts still show at
# http://localhost:9093) - swap in one of the commented examples for
# actual Slack/email/PagerDuty notifications.

global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: "default-receiver"
